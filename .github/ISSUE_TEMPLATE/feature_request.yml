name: Feature request
description: Suggest an idea for KnowledgeOS
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem you're trying to solve. Feature requests with clear use cases are easier to evaluate.

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What pain point does this address?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like this to work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you've thought about.

  - type: checkboxes
    id: scope
    attributes:
      label: Area
      options:
        - label: Extension (editor, sidebar, storage)
        - label: Themes
        - label: Landing site
        - label: Developer experience / tooling
